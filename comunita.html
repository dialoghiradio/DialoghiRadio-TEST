<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunità - Dialoghi Radio</title>

    <!-- Stile e risorse -->
    <link rel="stylesheet" href="stile.css">
    <style>
        /* Stili specifici per la pagina Comunità */
        body {
            text-align: center;
        }

        .titolo-comunita {
            font-size: 2.2rem;
            color: #0057B8;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .btn-comunita {
            width: 90%;
            max-width: 400px;
            margin: 10px auto;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            line-height: 1.4;
            color: #0057B8;
            background-color: #f5f5f5;
            border: 2px solid #ddd;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-comunita:active {
            transform: scale(0.96);
            background-color: #ddd;
        }

        .icona {
            font-size: 2rem;
            margin-right: 15px;
        }
    </style>
</head>

<body>

    <!-- Testata -->
    <header class="testata">
        <h1 class="titolo-comunita">🙏 COMUNITÀ</h1>
    </header>

    <!-- Contenuto Principale -->
    <main>
		<button class="btn-comunita bottone-condividi" onclick="apriChat()">
			<span class="icona">💬</span> Richiesta di preghiera
		</button>

		<button class="btn-comunita bottone-condividi" onclick="apriGruppo()">
			<span class="icona">👥</span> Preparazione conferenza
		</button>

        <button class="btn-comunita" onclick="entraConferenza()">
            <span class="icona">📞</span> Entra nella conferenza
        </button>

		<button class="btn-comunita bottone-condividi" onclick="condividi()">
            <span class="icona">📤</span> Invita nella Comunità
        </button>

        <div style="margin-top: 25px;">
            <a href="index.html" class="bottone">🏠 Torna alla Home</a>
        </div>
    </main>

    <!-- Script e Logica -->
    <script src="config.js"></script>
    <script>
        function apriChat() {
            window.location.href = CONFIG.comunita.whatsappPreghiera;
        }

        function apriGruppo() {
            window.location.href = CONFIG.comunita.gruppoWhatsapp;
        }

        function entraConferenza() {
            window.location.href = CONFIG.comunita.conferenza;
        }

        function condividi() {
            const url = window.location.href;
            const datiCondivisione = {
                title: "Comunità Dialoghi Radio",
                text: "Entra nella Comunità Dialoghi Radio 🙏",
                url: url
            };

            if (navigator.share) {
                navigator.share(datiCondivisione).catch(() => {
                    console.log("Condivisione annullata");
                });
            } else {
                const messaggio = encodeURIComponent(`Entra nella Comunità Dialoghi Radio 🙏\n\n${url}`);
                window.location.href = `https://wa.me/?text=${messaggio}`;
            }
        }
    </script>
</body>
</html>
